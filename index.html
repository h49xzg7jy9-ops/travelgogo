<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="应用中心 - Travel gogo & Guanxi Score">
    <title>应用中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --bg-color: #FFFFFF;
            --bg-secondary: #F5F5F7;
            --border-color: #D2D2D7;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #F5F5F7;
                --text-secondary: #86868B;
                --bg-color: #1D1D1F;
                --bg-secondary: #2C2C2E;
                --border-color: #38383A;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-color);
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 3rem;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .app-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 2.5rem;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            overflow: hidden;
            border: 2px solid rgba(0, 0, 0, 0.05);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .app-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .app-description {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 2rem;
            }

            .apps-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .app-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎使用</h1>
        <div class="apps-grid">
            <a href="../../../Travelgogo/Travel gogo/support.html" class="app-card travelgogo">
                <div class="app-icon">
                    <img src="app-logo.png" alt="Travel gogo">
                </div>
                <div class="app-name">Travel gogo</div>
                <div class="app-description">您的旅行助手，让每一次旅程都充满惊喜</div>
            </a>

            <a href="guanxi/support.html" class="app-card guanxi">
                <div class="app-icon">
                    <img src="guanxi/app-logo.png" alt="Guanxi Score">
                </div>
                <div class="app-name">Guanxi Score</div>
                <div class="app-description">科学评估你的人际关系，量化关系质量</div>
            </a>
        </div>
    </div>
</body>
</html>
